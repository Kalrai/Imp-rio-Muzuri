<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Império Muzuri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'muzuri-red': '#8b0000',
            'muzuri-dark': '#121212',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #121212; color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="selection:bg-red-900 selection:text-white">

  <!-- HEADER MOBILE -->
  <header class="md:hidden flex items-center justify-between p-4 bg-black border-b border-[#8b0000] sticky top-0 z-50">
    <div class="flex items-center gap-2 text-[#8b0000] font-bold text-xl uppercase tracking-widest">
      <i class="fa-solid fa-skull"></i> IMPÉRIO MUZURI
    </div>
    <button onclick="toggleMenu()" class="text-[#8b0000] text-2xl focus:outline-none">
      <i id="menuIcon" class="fa-solid fa-bars"></i>
    </button>
  </header>

  <!-- OVERLAY MOBILE -->
  <div id="backdrop" onclick="toggleMenu()" class="fixed inset-0 bg-black/75 z-30 hidden md:hidden backdrop-blur-sm"></div>

  <div class="min-h-screen flex flex-col md:flex-row">
    <!-- MENU LATERAL -->
    <nav id="sidebar" class="fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out bg-black w-72 p-6 border-r border-[#8b0000]/30 flex flex-col gap-6 z-40 overflow-y-auto">
      <div class="hidden md:flex items-center gap-2 text-[#8b0000] font-bold text-2xl uppercase tracking-widest border-b border-[#8b0000]/30 pb-4">
        <i class="fa-solid fa-skull"></i> MUZURI
      </div>
      
      <div class="flex flex-col gap-2">
        <p class="text-xs text-gray-500 uppercase tracking-widest mb-2 font-semibold">Biblioteca Interna</p>
        <div id="nav-buttons" class="flex flex-col gap-1.5"></div>
      </div>

      <div class="mt-auto pt-6 border-t border-[#8b0000]/30 text-xs text-gray-500 text-center leading-relaxed">
        Só pros zoeirão da família.<br><span class="text-gray-400">Respeita o fundamento!</span>
      </div>
    </nav>

    <!-- ÁREA DE LEITURA -->
    <main class="flex-1 p-6 md:p-12 overflow-y-auto w-full max-w-4xl mx-auto">
      <h1 id="chapter-title" class="text-3xl md:text-5xl font-black text-white mb-8 pb-4 border-b-2 border-[#8b0000] inline-block"></h1>
      <div id="chapter-body" class="space-y-6 text-base md:text-lg leading-relaxed text-gray-300"></div>
    </main>
  </div>

  <script>
    const capitulos = [
      {
        id: "introducao",
        icon: "fa-book-open",
        titulo: "Introdução",
        conteudo: `Me chamo Kalrai sou filho de Bará e sou filho da Cabocla Jurema, sou de uma tradição onde os elementos são muito importantes juntei em um lugar tudo que fui aprendendo sobre os elementos e trabalhos espirituais\na ideia do livro é compreender o porquê de cada elemento em um trabalho e como montar um trabalho pra cada problema\n\nA vida e o fundamento\nMuito por conta da nossa tradição indígena, aprendemos a dar valor à vida, tanto animal quanto vegetal. cada banho de ervas é um sacrifício de uma vida, e cada espécie de erva ou animal tem uma energia de vida diferente que pode ser usada de formas diferentes nas medicinas.\nPor isso, utilizar um elemento não é simplesmente pegar qualquer coisa e colocar dentro de uma receita. É entender o que estamos utilizando, respeitar sua origem e saber por que ele está sendo oferecido ou empregado naquele trabalho.\nCada elemento possui suas características. Uma planta nasce, cresce, busca nutrientes e se reproduz. Uma semente guarda a possibilidade de gerar uma nova vida. A água corre, a chuva alimenta a terra e o fogo transforma aquilo que toca.\nVocê começa a entender o porque aquela erva é usada pra tal coisa quando você observa ela na natureza, como ela vive. Então observar é o primeiro passo!!!!\n\nCada casa tem seu fundamento\nO que tem aqui é minha tradição, é o que aprendi com mais velhos e o que fui atrás de pesquisar pra colocar aqui, não significa que o que ta escrito aqui é lei, qualquer dúvida ou contradição me chama e vamos tomar um café e conversar de macumba!`
      },
      {
        id: "farinha",
        icon: "fa-fire-flame-curved",
        titulo: "Farinha",
        conteudo: `toda macumba tem uma base, tem começo, meio e fim, um conjunto de elementos + intenção + fundamento, a primeira coisa que estudamos é a base, a farinha representa muito a energia da terra, é justamente por conta disso que usamos as farinhas como base, um trabalho contém vários elementos juntos então vamos começar do começo...\n\nMandioca\nNasce e cresce debaixo da terra, responsável por sustentar a planta.\ne tem que ser muito do cuiudo pra tirar a mandioca de baixo da terra, ela é nosso maior símbolo de criar raízes, sustentar, firmeza.\nA Mandioca é sustentar, é arrancada da terra e queimada e moída, usada muito em padês onde queremos firmar com a energia da terra proteção, estabilizar algo, trazer força pra algo.\n\nMilho\nA semente rompe a terra cresce em busca do sol e com a energia solar transforma uma semente em várias espigas cada espiga com vários milhos, Energia solar, multiplicação e ampliação\nPor isso é muito usado para prosperidade, crescimento.\ncom isso a gente já entende mais ou menos como cada elemento vai afetar sua entrega. todos os elementos em uma magia tem que fazer sentido pra atingir o objetivo\nEntão vamos ao Exemplo: se queremos fazer uma entrega pra sustentar a saúde de alguém, começaria usando a farinha de Mandioca, agora se eu quiser ampliar prosperidade eu começaria pela farinha de milho`
      },
      {
        id: "temperatura",
        icon: "fa-wand-magic-sparkles",
        titulo: "Temperatura e Estado",
        conteudo: `a maioria do estudo da vida do macumbeiro está em volta das ervas, pra facilitar esse estudo a gente separa ela em temperaturas, isso ajuda a entender como elas funcionam energeticamente.\nmas isso não é lei e essas temperaturas mudam bastante de casa pra casa e é só uma forma de organizar o estudo, cada erva tem sua particularidade e separar em 3 etiquetas seria burrice kkkkk.\na gente vai usar nesse livro aqui para você sozinho ter um norte de como cada erva pode agir de forma diferente\nas ervas podem ser classificadas como\n• Fria ou Específica - Tem em geral trabalho de acalmar, desacelerar energias, ou aquelas que tem uma vibração muito específica.\n• Morna - Equilibra energias ou fazem algo vibrar em uma frequência e se algo vibra prosperidade por exemplo você atrai prosperidade, então podem ser chamadas de energizadoras\n• Quente - Movimenta energias, expulsa energias, agita energia, nada fica parado.\n\nErva Fresca e Erva Seca\nalém da erva ter uma classe (temperatura) ela tem seu estado atual, fresca ou seca:\nErva fresca = colhido na hora\nErva Seca = Erva que faz tempo que foi colhida, já está literalmente ressecada\né importante saber o estado atual da erva pra saber como vamos usá-la\nToda vez que usamos uma erva em um trabalho, buscamos a energia de vida dela, o que chamamos de sangue verde ou Moyo(energia, força espiritual).\nA erva fresca carrega essa energia no seu líquido. Quando maceramos um boldo fresco, por exemplo, a água fica bem verde porque rompemos as folhas e liberamos esse líquido. Ali temos o sangue verde da planta.\nJá quando a erva seca, entendemos que essa energia de vida fica adormecida. Então, precisamos despertar ela antes de usar.\nÉ aí que entra o calor. Nos banhos, maceramos a erva seca em água quente justamente para acordar essa energia e trazer movimento para ela. No charuto e no cachimbo, fazemos isso através do fogo, que transforma o Tabaco em fumaça.\n\nErva fresca -> sangue verde -> energia de vida.\nErva seca -> energia adormecida -> FOGO -> despertar.`
      },
      {
        id: "7-ervas",
        icon: "fa-leaf",
        titulo: "7 Ervas de Umbanda",
        conteudo: `O Principal desse livro é o estudo das ervas e outros elementos, quando o assunto é estudar ervas temos que primeiro dominar as 7 ervas principais de umbanda, depois as outras, essas 7 ervas principais na minha família são:\n• Boldo\n• Alecrim\n• Espada de Ogum\n• Arruda\n• Guiné\n• Alfazema\n• Manjericão\n\nCom esse fundamento na mão você já sabe descarregar, energizar, tranquilizar, proteger ambiente, defumar.\n\nBoldo\n• Classificação: Fria (Limpeza, equilíbrio e alívio)\nFamoso Tapete de Oxalá, o Boldo é uma erva muito usada em banhos de limpeza, banhos pré-gira e amacis. Suas folhas são muito amargas e, na medicina popular, é usado para ajudar na digestão e em ressacas.\nAmargor -> alívio dos excessos -> equilíbrio -> purificação.\n! Cuidados: Gestantes devem evitar.\n\nAlecrim\n• Classificação: Morna (Energização, clareza e vitalidade)\nO alecrim é uma erva muito aromática. É uma planta resistente, gosta de sol e consegue se desenvolver bem em ambientes mais secos.\nPor isso, dentro da magia, é muito usado para energizar, fortalecer, trazer ânimo e clarear a pessoa ou a mente.\n\nEspada-de-Ogum\n• Classificação: Quente (Corte, limpeza e proteção)\nA Espada-de-Ogum é uma planta de folhas longas, firmes, pontiagudas e que crescem para cima.\nÉ como se ela fosse a segurança da casa: fica na entrada, protege, corta e ajuda a manter o ambiente protegido.\n! Cuidados: algumas espécies podem ser tóxicas para Pets.\n\nArruda\n• Classificação: Quente (Limpeza pesada e proteção)\nCheiro forte -> afasta -> protege -> limpa.\nA Arruda ficou conhecida como uma erva de proteção contra o mau-olhado e a inveja.\n! Cuidados: Uso interno é contraindicado para grávidas.\n\nGuiné\n• Classificação: Quente (Muito agressiva / Limpeza pesada)\nela se defende de ataques, cria proteção, cria contra-ataque isso fez a planta ser associada a Afastamento de energias negativas e proteção.\n! Cuidados: Pode ser Tóxica, então cuidado no uso interno.\n\nAlfazema (Lavanda)\n• Classificação: Fria (Harmonizadora e pacificadora)\nAroma suave -> acalma -> harmoniza -> purifica.\né justamente essa ação que faz ela ser usada em trabalhos onde buscamos calma, paz, harmonia e sensação de bem-estar.\n\nManjericão\n• Classificação: Morna (Controle emocional, equilíbrio, harmonização e limpeza)\nNa nossa tradição, ele é muito usado para controle emocional, equilíbrio e harmonização. toda vez que o excesso de emoções está atrapalhando algo usamos o manjericão.`
      },
      {
        id: "aguas",
        icon: "fa-droplet",
        titulo: "Águas",
        conteudo: `Assim como cada erva possui uma característica própria, cada água carrega a história do lugar e do momento em que esteve presente.\nÁgua do mar, água de rio, água de chuva ou água de nascente continuam sendo água, mas não encontramos cada uma delas da mesma maneira na natureza.\n\nÁgua do Mar\nÁgua da kalunga Grande, representa muita coisa pra gente macumbeiro, é a representação física do mundo espiritual, é a representação de ciclos.\nNa magia, a água do mar é tradicionalmente associada à limpeza, ao descarrego, à renovação e à movimentação de energias.\nReceber -> movimentar -> transformar -> devolver.\n\nÁgua de Rio\nO rio está sempre seguindo um caminho.\nNa magia, a água de rio pode ser relacionada ao movimento, à passagem e ao desenvolvimento dos caminhos.\nFluxo -> movimento -> passagem -> continuidade.\n\nÁgua da Chuva\nA chuva cai sobre a terra, molha o solo e fornece água para que as plantas cresçam.\nChuva -> nutrição -> crescimento -> renovação.\n\nÁgua de Cachoeira\nNa cachoeira, a água cai com força, produz impacto e movimenta aquilo que encontra pelo caminho.\nQueda -> impacto -> movimento -> transformação.\n\nÁgua de Coco\nA água de coco está protegida dentro do fruto e faz parte do desenvolvimento da semente.\nNa nossa tradição, é utilizada em trabalhos ligados à cabeça e ao Ori.\nProteção -> nutrição -> pureza -> fortalecimento.`
      },
      {
        id: "bebidas",
        icon: "fa-mug-hot",
        titulo: "Bebidas e Fumos",
        conteudo: `Muitas pessoas de fora da religião olham para as entidades bebendo e pensam apenas que é um vício ou um gosto que aquela entidade tinha em vida. Pouco se fala sobre o fundamento por trás de cada bebida.\n\nCachaça\nA cachaça é uma bebida forte e quente. Quando bebemos, sentimos o calor se espalhar pelo corpo.\nTambém existe o entendimento de que o álcool pode ajudar a juntar e concentrar as forças de um trabalho, deixando aquilo mais forte e mais concentrado.\nFermentação + destilação -> concentração -> calor -> limpeza -> movimento.\n\nCafé\nO café é uma das bebidas mais usadas nos trabalhos espirituais, principalmente quando falamos do Povo das Almas e dos Pretos Velhos.\nEle ajuda a tirar o cansaço e trazer a mente para o presente.\n\nChampanhe e Espumantes\nQuando olhamos para a bebida, encontramos algumas características muito marcantes: ela é aromática, festiva, borbulhante, formosa, gostosa. Ela não passa despercebida. Essa linguagem conversa muito com a imagem ritual das Pombagiras.\n\nVinho\nO vinho é uma bebida que passou por transformação. o Vinho fala muito sobre Amadurecimento.\nPor isso, o vinho pode ser usado quando queremos trabalhar amor, prazer, celebração, prosperidade, união e amadurecimento.\n\nFumos e o fundamento da fumaça\nTabaco não é sinônimo de cigarro. Tabaco é medicina e comunicação com o sagrado.\nQuando o guia coloca o Tabaco na boca, ele trabalha uma determinada energia dentro de si e depois a externaliza através da fumaça.\nEnergia -> intenção -> sopro -> fumaça -> manifestação.`
      },
      {
        id: "receitas",
        icon: "fa-mortar-pestle",
        titulo: "Receitas e Mandingas",
        conteudo: `Banhos\nos banhos de ervas são usados a milênios de anos na nossa tradição. Abaixo tem algumas receitas prontas de banhos.\n\nBanho de descarrego Boldo\n• 10 a 15 folhas de boldo\n• 1 fio de mel ou 1 colher de açúcar\n• 7 borrifadas de um perfume (se você já sabe seu orixá use a numerologia dele)\nusamos para descarregar, equilibrar e energizar uma pessoa, é o famoso arroz e feijão que ajuda em tudo.\n\nBanho desenvolvimento mediúnico (Incorporação)\n• 3 a 5 Anis Estrelados\n• 3 Galhos de Samambaia\n• punhado de erva complementar\n\nBanho Controle Emocional\n• 1 Maço de Manjericão\n• 1 Maço de Hortelã\n• Água do cozimento de canjica (grão de milho branco inteiro)\nEm uma bacia grande, macere o manjericão e a hortelã em água fria e reserve. Em uma panela, cozinhe a canjica. Após o Cozimento retire a água e misture-a às ervas maceradas.\n\nMandingas\nPote do puxa saco\nQuando tu tiver um mardito te perturbando e tu quiser que ele pare de te encher o saco você faz isso:\n• Pote (qualquer pote)\n• nome da pessoa 7 vezes num papelzim\ncoloca o nome no pote, em cima do nome tu coloca Sal grosso e todo tipo de pimenta que tiver ai.\nLacra esse pote e taca no freezer, deixe esse pote apodrecer lá.\n\nTrouxinha Preta\nnum pano de cetim preto você coloca o nome da pessoa. em cima do nome você entope de Sal grosso e por cima todo tipo de pimenta. amarra a trouxinha e enterra na encruzilhada, cemitério ou praia.\n\nPote da Imunidade Alho e Mel\ncoloca os dentes de alho em um pote de vidro e cobre tudo com mel, deixa 15 dias em um armário escuro e depois pode comer 1 por dia.`
      }
    ];

    let capAtualId = capitulos[0].id;

    function renderNav() {
      const container = document.getElementById('nav-buttons');
      container.innerHTML = '';
      capitulos.forEach(cap => {
        const btn = document.createElement('button');
        const active = cap.id === capAtualId;
        btn.className = `flex items-center gap-3 text-left p-3 rounded-lg transition-all w-full text-sm font-medium ${
          active 
            ? 'bg-[#8b0000] text-white shadow-[0_0_15px_rgba(139,0,0,0.5)] font-bold' 
            : 'text-gray-400 hover:bg-neutral-900 hover:text-red-400'
        }`;
        btn.innerHTML = `<i class="fa-solid ${cap.icon} w-5 text-center"></i> <span>${cap.titulo}</span>`;
        btn.onclick = () => selectCapitulo(cap.id);
        container.appendChild(btn);
      });
    }

    function selectCapitulo(id) {
      capAtualId = id;
      const cap = capitulos.find(c => c.id === id);
      document.getElementById('chapter-title').innerText = cap.titulo;
      
      const body = document.getElementById('chapter-body');
      body.innerHTML = '';
      
      const paragraphs = cap.conteudo.split('\n\n');
      paragraphs.forEach(p => {
        if (p.includes('•') || p.includes('!')) {
          const card = document.createElement('div');
          card.className = "bg-black/60 border-l-4 border-[#8b0000] p-4 rounded-r-lg whitespace-pre-wrap text-gray-200 text-sm md:text-base leading-relaxed";
          card.innerText = p;
          body.appendChild(card);
        } else {
          const para = document.createElement('p');
          para.className = "whitespace-pre-wrap text-sm md:text-base leading-relaxed";
          para.innerText = p;
          body.appendChild(para);
        }
      });

      renderNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      closeMenu();
    }

    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('backdrop');
      const icon = document.getElementById('menuIcon');
      const isOpen = !sidebar.classList.contains('-translate-x-full');
      
      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
        icon.className = "fa-solid fa-bars";
      } else {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
        icon.className = "fa-solid fa-xmark";
      }
    }

    function closeMenu() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('backdrop');
      const icon = document.getElementById('menuIcon');
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
      if (icon) icon.className = "fa-solid fa-bars";
    }

    // Inicialização
    selectCapitulo(capitulos[0].id);
  </script>
</body>
</html>
