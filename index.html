      }
    ];

    let currentChapterIndex = 0;
    let filteredCapitulos = [...capitulos];

    function renderNav() {
      const container = document.getElementById('nav-container');
      container.innerHTML = '';

      if (filteredCapitulos.length === 0) {
        container.innerHTML = `
          <div class="p-6 text-center text-gray-500">
            <i class="fa-regular fa-face-meh text-2xl mb-2 text-gray-600"></i>
            <p class="text-xs">Nenhum fundamento encontrado com essa palavra.</p>
          </div>
        `;
        return;
      }

      filteredCapitulos.forEach((cap) => {
        const originalIndex = capitulos.findIndex(c => c.id === cap.id);
        const isActive = originalIndex === currentChapterIndex;
        
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-3 rounded-2xl flex items-center gap-3.5 transition-all duration-200 group relative ${
          isActive 
            ? 'bg-gradient-to-r from-muzuri-accent to-red-950/80 text-white shadow-glow-red border border-muzuri-gold/40' 
            : 'text-gray-400 hover:text-white hover:bg-[#15161d] border border-transparent'
        }`;
        
        btn.innerHTML = `
          <div class="w-10 h-10 rounded-xl flex items-center justify-center transition-transform group-hover:scale-105 ${
            isActive ? 'bg-black/40 text-muzuri-gold' : 'bg-[#181922] text-gray-400 group-hover:text-red-400'
          }">
            <i class="fa-solid ${cap.icon} text-sm"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-[10px] font-semibold tracking-wider uppercase ${isActive ? 'text-muzuri-gold' : 'text-gray-500'}">
              ${cap.tag}
            </div>
            <div class="text-sm font-semibold truncate ${isActive ? 'text-white' : 'text-gray-300'}">
              ${cap.titulo}
            </div>
          </div>
          ${isActive ? '<i class="fa-solid fa-chevron-right text-xs text-muzuri-gold pr-1"></i>' : ''}
        `;
        
        btn.onclick = () => {
          selectChapterByIndex(originalIndex);
          closeMenu();
        };

        container.appendChild(btn);
      });
    }

    function selectChapterByIndex(index) {
      if (index < 0 || index >= capitulos.length) return;
      currentChapterIndex = index;
      const cap = capitulos[currentChapterIndex];

      // Atualiza URL hash para compartilhamento direto
      window.location.hash = cap.id;

      // Badges e Cabeçalho
      document.getElementById('badge-category').innerText = cap.tag;
      document.getElementById('badge-count').innerText = `Capítulo ${index + 1} de ${capitulos.length}`;
      document.getElementById('chapter-title').innerText = cap.titulo;

      // Renderiza blocos de conteúdo com hierarquia visual elegante
      const container = document.getElementById('chapter-body');
      container.innerHTML = '';

      const paragraphs = cap.conteudo.split('\n\n');

      paragraphs.forEach((p, pIdx) => {
        const trimmed = p.trim();
        if (!trimmed) return;

        // Se for uma lista de marcadores (•) ou aviso (!)
        if (trimmed.includes('•') || trimmed.includes('! Cuidados:')) {
          const card = document.createElement('div');
          card.className = "glass-card p-5 md:p-6 rounded-2xl relative overflow-hidden transition-all";
          
          // Barra lateral com cor do arquétipo
          const accentBar = document.createElement('div');
          accentBar.className = "absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-muzuri-crimson to-muzuri-gold";
          card.appendChild(accentBar);

          const lines = trimmed.split('\n');
          const linesContainer = document.createElement('div');
          linesContainer.className = "space-y-2.5 pl-2 text-sm sm:text-base leading-relaxed";

          lines.forEach(line => {
            const lTrimmed = line.trim();
            if (lTrimmed.startsWith('•')) {
              const item = document.createElement('div');
              item.className = "flex items-start gap-3 text-gray-200";
              item.innerHTML = `
                <span class="text-muzuri-gold mt-1 text-xs"><i class="fa-solid fa-circle-dot"></i></span>
                <span>${lTrimmed.replace('•', '').trim()}</span>
              `;
              linesContainer.appendChild(item);
            } else if (lTrimmed.startsWith('! Cuidados:')) {
              const warn = document.createElement('div');
              warn.className = "mt-3 p-3 rounded-xl bg-red-950/40 border border-red-800/40 text-red-300 text-xs sm:text-sm flex items-center gap-2.5";
              warn.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400 text-sm"></i> <strong>Atenção:</strong> ${lTrimmed.replace('! Cuidados:', '').trim()}`;
              linesContainer.appendChild(warn);
            } else {
              const text = document.createElement('p');
              text.className = "text-gray-300 font-medium";
              text.innerText = lTrimmed;
              linesContainer.appendChild(text);
            }
          });

          card.appendChild(linesContainer);
          container.appendChild(card);
        }
        // Se for um subtítulo ou elemento em destaque (poucas palavras, ex: Mandioca, Milho, Erva Fresca...)
        else if (trimmed.length < 45 && !trimmed.includes('.') && pIdx > 0) {
          const subHeading = document.createElement('h3');
          subHeading.className = "text-xl sm:text-2xl font-title font-bold text-white pt-6 pb-2 border-b border-muzuri-border/40 flex items-center gap-3";
          subHeading.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-muzuri-crimson"></span> ${trimmed}`;
          container.appendChild(subHeading);
        }
        // Parágrafo corrido padrão com espaçamento confortável
        else {
          const paragraphEl = document.createElement('p');
          paragraphEl.className = "text-base sm:text-lg leading-relaxed text-gray-300 whitespace-pre-wrap font-normal";
          
          // Destaca sutilmente fórmulas e setas (ex: "Erva fresca -> sangue verde")
          if (trimmed.includes('->')) {
            const formulaCard = document.createElement('div');
            formulaCard.className = "p-4 rounded-xl bg-black/60 border border-muzuri-gold/30 text-muzuri-gold font-mono text-xs sm:text-sm my-4 flex items-center gap-2 overflow-x-auto";
            formulaCard.innerHTML = `<i class="fa-solid fa-arrow-progress text-muzuri-crimson"></i> <span>${trimmed}</span>`;
            container.appendChild(formulaCard);
          } else {
            paragraphEl.innerText = trimmed;
            container.appendChild(paragraphEl);
          }
        }
      });

      // Atualiza botões Anterior / Próximo
      updateFooterNav();
      renderNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateFooterNav() {
      const prevBtn = document.getElementById('btn-prev');
      const nextBtn = document.getElementById('btn-next');
      const prevTitle = document.getElementById('prev-title');
      const nextTitle = document.getElementById('next-title');

      if (currentChapterIndex > 0) {
        prevBtn.style.visibility = 'visible';
        prevTitle.innerText = capitulos[currentChapterIndex - 1].titulo;
      } else {
        prevBtn.style.visibility = 'hidden';
      }

      if (currentChapterIndex < capitulos.length - 1) {
        nextBtn.style.visibility = 'visible';
        nextTitle.innerText = capitulos[currentChapterIndex + 1].titulo;
      } else {
        nextBtn.style.visibility = 'hidden';
      }
    }

    function prevChapter() {
      if (currentChapterIndex > 0) selectChapterByIndex(currentChapterIndex - 1);
    }

    function nextChapter() {
      if (currentChapterIndex < capitulos.length - 1) selectChapterByIndex(currentChapterIndex + 1);
    }

    // Busca rápida em tempo real
    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const clearBtn = document.getElementById('clearSearchBtn');
      
      if (q.length > 0) {
        clearBtn.classList.remove('hidden');
        filteredCapitulos = capitulos.filter(c => 
          c.titulo.toLowerCase().includes(q) || 
          c.conteudo.toLowerCase().includes(q) ||
          c.tag.toLowerCase().includes(q)
        );
      } else {
        clearBtn.classList.add('hidden');
        filteredCapitulos = [...capitulos];
      }
      renderNav();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      handleSearch('');
      input.focus();
    }

    // Copiar link do capítulo
    function copyChapterLink() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Link do capítulo copiado para o WhatsApp!');
      }).catch(() => {
        showToast('Capítulo pronto para compartilhamento!');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      msgEl.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Menu Mobile
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('backdrop');
      const icon = document.getElementById('menuIcon');
      const isOpen = !sidebar.classList.contains('-translate-x-full');

      if (isOpen) {
        closeMenu();
      } else {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
        icon.className = "fa-solid fa-xmark text-muzuri-crimson";
      }
    }

    function closeMenu() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('backdrop');
      const icon = document.getElementById('menuIcon');
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
      if (icon) icon.className = "fa-solid fa-bars-staggered";
    }

    // Barra de Leitura Superior Conectada ao Scroll
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      document.getElementById('progress-bar').style.width = scrolled + "%";
    });

    // Leitura inicial via Hash na URL (permite abrir direto no capítulo pelo link enviado)
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      const foundIdx = capitulos.findIndex(c => c.id === hash);
      if (foundIdx !== -1) {
        selectChapterByIndex(foundIdx);
      } else {
        selectChapterByIndex(0);
      }
    });
  </script>
</body>
</html>
